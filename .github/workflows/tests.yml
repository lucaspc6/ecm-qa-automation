name: Run Robot Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tests repo
        uses: actions/checkout@v4

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: lucaspc6/ecm-marketplace-app
          path: app 
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        run: |
          cd app
          npm install

      - name: Start app server
        run: |
          cd app
          npm start &
          
      - name: Wait for server
        run: sleep 5

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          rfbrowser init

      - name: Run tests
        run: |
            robot tests/auth.robot tests/products.robot tests/checkout.robot
        env:
            HEADLESS: True


